name: PR Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '0 * * * *' # Every hour

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: wagmiiii/pr-reviewer@feat/sweep-performance-optimizations
        with:
          dryRun: 'false'
